name: Scaffold contracts
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r apps/api/requirements-dev.txt
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:preserved
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - run: pnpm exec playwright test --project desktop --grep 'effect replay|explicit audio gesture|scoped mock preview|edits portrait overrides|exports the saved manifest|forks and switches|records a real portrait'
        env:
          CI: 'true'
          AETHER_E2E_DEV: '1'
